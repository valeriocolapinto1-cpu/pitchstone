name: ci-linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/worker-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/worker-ai/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # La configurazione del Worker deve restare valida (binding, rotte, cron) anche senza deploy.
      - run: npx wrangler deploy --dry-run
      - run: npm audit --omit=dev --audit-level=high

  # App web per il PC: tipi, test e build.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tools/keepalive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/keepalive/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0
      # Database, API REST, auth (per le chiavi) e storage (allegati): il resto non serve.
      # Va avviato tutto insieme: dopo `supabase db start`, `supabase start` non avvia altro.
      - name: Applica migrazioni e seed, avvia l'API REST locale
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Lint dello schema
        run: supabase db lint --level warning --fail-on warning
      - name: Test dello schema
        run: supabase test db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/worker-ai/package-lock.json
            web/package-lock.json
      - name: Test end-to-end della sync (Worker → Supabase)
        working-directory: backend/worker-ai
        shell: bash
        run: |
          npm ci
          eval "$(supabase status -o env --workdir ..)"
          E2E_REQUIRED=1 E2E_ALLOW_WIPE=1 E2E_SUPABASE_URL="$API_URL" E2E_SUPABASE_SECRET_KEY="$SECRET_KEY" E2E_SUPABASE_ANON_KEY="$ANON_KEY" \
            npm run test:e2e -- --reporter=verbose
      - name: Test end-to-end della sync (iPad ↔ PWA)
        working-directory: web
        shell: bash
        run: |
          npm ci
          eval "$(supabase status -o env --workdir ../backend)"
          E2E_REQUIRED=1 E2E_SUPABASE_URL="$API_URL" E2E_SUPABASE_SECRET_KEY="$SECRET_KEY" \
            npx vitest run test/e2e.test.ts --reporter=verbose

  # Logica di sync del client: Foundation pura, gira su Linux a costo 1x.
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2-noble
    defaults:
      run:
        working-directory: ios/PitchstoneKit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift build --build-tests -Xswiftc -warnings-as-errors
      - run: swift test --skip-build

  # Un solo controllo da richiedere come obbligatorio nelle regole del branch: passa solo se passano tutti.
  ci:
    if: always()
    needs: [worker, web, keepalive, database, swift]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tutti i job devono essere riusciti
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "Almeno un job non è riuscito"
            exit 1
          fi
