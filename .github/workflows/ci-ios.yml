name: ci-ios

on:
  push:
    branches: [main]
    # macOS costa 10x: si parte solo se cambia il codice iOS.
    paths:
      - "ios/**"
      - ".github/workflows/ci-ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ci-ios.yml"
  workflow_dispatch:

permissions:
  # Scrittura solo per pubblicare gli screenshot in refs/screenshots/latest.
  contents: write

concurrency:
  group: ci-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Un solo job: ogni avvio di un runner macOS costa minuti.
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version

      # Include lo strato SwiftData, che su Linux non esiste.
      - name: Test del package
        # Se un test va in crash, il run in parallelo non dice quale: si ripete in
        # sequenza e si stampa il crash report del processo di test.
        run: |
          swift test --package-path ios/PitchstoneKit && exit 0
          swift test --package-path ios/PitchstoneKit --no-parallel || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            if grep -q PitchstoneKit "$f" 2>/dev/null; then head -c 30000 "$f"; fi
          done
          exit 1

      - name: Scegli il simulatore iPad
        id: sim
        # Il runtime non può essere più recente dell'SDK di Xcode, o xcodebuild non lo trova.
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "SDK simulatore: $sdk"
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          sdk = [int(x) for x in sys.argv[1].split(".")]
          devices = json.load(sys.stdin)["devices"]
          version = lambda runtime: [int(x) for x in runtime.split("iOS-")[1].split("-")]
          ipads = [(runtime, d) for runtime, items in devices.items() if ".iOS-" in runtime
                   and version(runtime) <= sdk
                   for d in items if d["name"].startswith("iPad")]
          if not ipads:
              sys.exit("nessun simulatore iPad disponibile")
          runtime, device = sorted(ipads, key=lambda t: version(t[0]))[-1]
          print(device["udid"], file=sys.stdout)
          print(device["name"], runtime, file=sys.stderr)
          ' "$sdk")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test dell'app su simulatore iPad
        run: >
          xcodebuild test
          -project ios/Pitchstone.xcodeproj
          -scheme Pitchstone
          -destination "id=${{ steps.sim.outputs.udid }}"
          -resultBundlePath test-results/test.xcresult
          -skipMacroValidation
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO

      # Screenshot dei test di interfaccia (PitchstoneUITests), per vedere l'app senza
      # un iPad. Vanno in un commit nuovo sopra refs/screenshots/latest: un ref che non è
      # un branch, così nessuna build parte per loro. Non bloccano mai la CI.
      - name: Pubblica gli screenshot
        if: always() && hashFiles('test-results/test.xcresult/Info.plist') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          raw="$RUNNER_TEMP/attachments"
          out="$RUNNER_TEMP/screenshots"
          mkdir -p "$raw" "$out"
          xcrun xcresulttool export attachments --path test-results/test.xcresult --output-path "$raw"
          python3 - "$raw" "$out" <<'PY'
          import json, os, re, subprocess, sys
          raw, out = sys.argv[1], sys.argv[2]
          for test in json.load(open(os.path.join(raw, "manifest.json"))):
              for item in test.get("attachments", []):
                  match = re.match(r"(\d\d-[a-z0-9-]+)", item.get("suggestedHumanReadableName", ""))
                  if match:
                      subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "75", "-Z", "1600",
                                      os.path.join(raw, item["exportedFileName"]),
                                      "--out", os.path.join(out, match.group(1) + ".jpg")], check=True)
          PY
          ls "$out"
          cd "$out"
          printf "Screenshot dell'app\n\nBranch: %s\nCommit: %s\n" "$SOURCE_REF" "$SOURCE_SHA" > README.md
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q
          if git fetch -q --depth 1 "$remote" refs/screenshots/latest; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshot di $SOURCE_REF ($SOURCE_SHA)"
          git push -q "$remote" HEAD:refs/screenshots/latest

      # IPA non firmato da installare con Sideloadly (ARCHITETTURA.md, sezione 11).
      - name: IPA non firmato
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild build \
            -project ios/Pitchstone.xcodeproj \
            -scheme Pitchstone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pitchstone.app Payload/
          zip -qry Pitchstone.ipa Payload
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: Pitchstone-${{ github.sha }}
          path: Pitchstone.ipa
          retention-days: 14
          if-no-files-found: error
