name = "ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Valori pubblici, da compilare prima del deploy. Se mancano, /sync/* risponde
# 401 (Access) o 503 (Supabase): il Worker non apre mai la sync per errore.
[vars]
SUPABASE_URL = "https://tocauhzfxphnvmpklmkl.supabase.co"          # https://<progetto>.supabase.co
ACCESS_TEAM_DOMAIN = "https://snowy-smoke-d179.cloudflareaccess.com"    # https://<team>.cloudflareaccess.com
ACCESS_AUD = "403239a9ba9686f0adb70bf6d77783e17f8f2c6e287189a840ea1e5a211a4817"            # AUD tag dell'applicazione Access
GEMINI_MODEL = "gemini-2.5-flash"

# Anteprime dei branch (Workers Builds esegue `wrangler preview` fuori da main):
# valori vuoti di proposito, così un'anteprima non raggiunge mai Supabase di
# produzione e /sync/* resta chiuso. Funziona solo /health.
[previews.vars]
SUPABASE_URL = ""
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# Pulizia dei file degli allegati eliminati e backup, dopo purge_trash (03:00 UTC).
# Il secondo cron rifà solo il backup, se quello delle 04:30 non è riuscito.
[triggers]
crons = ["30 4 * * *", "30 10 * * *"]

# Log e tracce nel pannello di Cloudflare. I log del Worker non contengono testi delle note.
[observability]
enabled = true

# Limite di richieste alla chat per identità: 20 al minuto.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# Secret: wrangler secret put GEMINI_API_KEY
#         wrangler secret put SUPABASE_SECRET_KEY

# Versione PC (fase 10): la PWA in web/ è servita dallo stesso Worker, dietro
# Cloudflare Access (login Google). Le API passano prima dal Worker.
[build]
command = "npm --prefix ../../web ci && npm --prefix ../../web run build"

[assets]
directory = "../../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/sync/*", "/storage/*", "/ai/*", "/account/*", "/status", "/health"]
