name = "ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Valori pubblici, da compilare prima del deploy. Se mancano, /sync/* risponde
# 401 (Access) o 503 (Supabase): il Worker non apre mai la sync per errore.
[vars]
SUPABASE_URL = ""          # https://<progetto>.supabase.co
ACCESS_TEAM_DOMAIN = ""    # https://<team>.cloudflareaccess.com
ACCESS_AUD = ""            # AUD tag dell'applicazione Access

# Secret: wrangler secret put GEMINI_API_KEY
#         wrangler secret put SUPABASE_SECRET_KEY
