<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitchstone</title>
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)">
</head>
<body>
  <aside>
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <strong>Pitchstone</strong>
      <button id="chat-toggle" class="ghost" title="Tutor sugli appunti (⌘J)">Tutor</button>
      <button id="new" class="primary icon" title="Nuovo nodo (⌘N)" aria-label="Nuovo nodo">＋</button>
    </div>
    <label class="search"><input id="search" type="search" placeholder="Cerca negli appunti" aria-label="Cerca (⌘K)"></label>
    <div id="count" class="count"></div>
    <ul id="list"></ul>
    <div id="rejections" hidden></div>
    <div id="status">Solo locale</div>
  </aside>
  <main>
    <div id="empty">
      <h2>Nessun nodo aperto</h2>
      <p>Scegli un appunto dall'elenco o creane uno nuovo.</p>
      <p class="hint"><kbd>⌘</kbd> <kbd>N</kbd> nuovo · <kbd>⌘</kbd> <kbd>K</kbd> cerca · <kbd>⌘</kbd> <kbd>J</kbd> tutor</p>
    </div>
    <section id="node" hidden>
      <div class="toolbar">
        <button id="back" class="ghost back" aria-label="Torna all'elenco">‹ Elenco</button>
        <div class="segmented" role="group" aria-label="Vista">
          <button data-mode="write">Scrivi</button>
          <button data-mode="split">Affiancato</button>
          <button data-mode="preview">Anteprima</button>
        </div>
        <span class="spacer"></span>
        <button id="trash" class="ghost danger">Sposta nel cestino</button>
      </div>
      <div id="editor">
        <div class="meta">
          <span id="area-dot" aria-hidden="true"></span>
          <select id="area" aria-label="Area"></select>
          <select id="type" aria-label="Tipo"></select>
          <input id="tags" placeholder="Tag, separati da virgole" aria-label="Tag">
        </div>
        <input id="title" placeholder="Titolo" aria-label="Titolo">
      </div>
      <div id="panes" class="panes" data-mode="split">
        <textarea id="body" placeholder="Scrivi in Markdown. [[Titolo]] collega un altro nodo." aria-label="Testo"></textarea>
        <article id="preview"></article>
      </div>
    </section>
  </main>
  <section id="chat" hidden aria-label="Tutor">
    <header><strong>Tutor</strong><button id="chat-new" class="ghost">Nuova chat</button><button id="chat-close" class="ghost icon" title="Chiudi" aria-label="Chiudi">✕</button></header>
    <div id="chat-settings">
      <label>Modello locale <input id="chat-model" placeholder="llama3.2" spellcheck="false"></label>
      <label><input type="checkbox" id="chat-local-only"> Solo locale (mai Gemini)</label>
    </div>
    <div id="chat-log"></div>
    <form id="chat-form"><textarea id="chat-input" placeholder="Chiedi qualcosa sui tuoi appunti" rows="2"></textarea><button id="chat-send" class="primary">Invia</button></form>
  </section>
  <div id="blocked" hidden>Pitchstone è già aperto in un'altra scheda: chiudila per continuare qui.</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
